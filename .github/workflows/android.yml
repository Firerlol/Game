
name: Build Eldoria APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_HOME: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get game files
        uses: actions/checkout@v4
        with:
          path: project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create temporary signing key
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -storepass android \
            -keypass android \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Eldoria"

      - name: Install Ren'Py and Android tools
        uses: Ayowel/renpy-setup-action@v3
        with:
          action: install
          install_dir: renpy
          dlc: rapt
          android_sdk: true
          android_properties: |
            key.alias=android
            key.store.password=android
            key.alias.password=android
            key.store=${{ github.workspace }}/android.keystore

      - name: Check game scripts
        uses: Ayowel/renpy-setup-action@v3
        with:
          action: lint
          install_dir: renpy
          game: project

      - name: Build Android APK
        uses: Ayowel/renpy-setup-action@v3
        with:
          action: android_build
          install_dir: renpy
          build_type: apk
          game: project
          out_dir: target

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eldoria-APK
          path: target/*.apk
          if-no-files-found: error
          retention-days: 7
          
